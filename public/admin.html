<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Tesoro</title><meta name="color-scheme" content="dark">
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#14213d;color:#fff;min-height:100vh}
header{background:#0e1a33;color:#fff;padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1}
main{max-width:1100px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:#1f3159;border-radius:16px;padding:16px;margin-bottom:16px}
h2{margin:0 0 10px;font-size:16px}
input,textarea,select{font:inherit;padding:10px;border:1px solid #33497a;border-radius:10px;width:100%;background:#0e1a33;color:#fff}
input::placeholder,textarea::placeholder{color:#8b9bc2}
input:focus,textarea:focus,select:focus{outline:2px solid #fca311;border-color:#fca311}
textarea{resize:vertical;min-height:60px}
button,a.btn{font:inherit;padding:9px 14px;border-radius:10px;border:0;background:#fca311;color:#14213d;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}
button.sec{background:#33497a;color:#fff}button.danger{background:#c1443d;color:#fff}
.row{display:grid;grid-template-columns:34px 1fr 90px auto;gap:6px;margin-bottom:8px;align-items:start;border-radius:10px}
.pos{font-weight:700;padding:10px 0;text-align:center;color:#fca311;cursor:grab;user-select:none;border-radius:10px;background:#0e1a33}
.pos::before{content:'⋮⋮ ';color:#5b6f9c;font-size:11px;letter-spacing:-2px}
.row.dragging{opacity:.4}
.acts{display:flex;gap:4px}.acts button{padding:9px 9px}
@media(max-width:500px){.row{grid-template-columns:34px 1fr 90px}.acts{grid-column:2/4;justify-content:flex-end}}
.f{display:flex;gap:8px;margin-bottom:8px}.f>*{flex:1}
.prog{font-size:14px;margin:4px 0;opacity:.8}.done{color:#5fd4c4;font-weight:600;opacity:1}
.muted{color:#9fb0d6;font-size:13px}
.login{max-width:320px;margin:80px auto}
</style></head><body>
<div id="root"></div>
<script>
const root = document.getElementById('root');
let data = null;
const api = async (path, method = 'GET', body) => {
  const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  return { status: r.status, data: await r.json().catch(() => ({})) };
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function login(err) {
  root.innerHTML = `<div class="card login"><h2>Admin</h2><input id="pw" type="password" placeholder="Contraseña">
  <p style="color:#ff9b94">${err || ''}</p><button id="go">Entrar</button></div>`;
  const go = async () => { const r = await api('/api/admin/login', 'POST', { password: pw.value }); r.status === 200 ? load() : login(r.data.error); };
  document.getElementById('go').onclick = go; pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); }); pw.focus();
}

async function load() {
  const r = await api('/api/admin/data');
  if (r.status === 401) return login();
  data = r.data; build();
}

function qrOptions(sel) {
  let o = '<option value="">—</option>';
  for (let i = 1; i <= data.qr_count; i++) o += `<option value="${i}" ${sel == i ? 'selected' : ''}>QR #${i}</option>`;
  return o;
}

function stepRow(t, s, i) {
  return `<div class="row" data-team="${t}"><div class="pos" title="Arrastrar para reordenar">${i + 1}</div>
  <div><textarea placeholder="Texto de la pista">${esc(s.clue)}</textarea>
  <input class="loc" style="margin-top:6px" placeholder="📍 Lugar donde lo dejé (opcional, solo lo ves vos)" value="${esc(s.location)}"></div>
  <select>${qrOptions(s.qr_id)}</select>
  <div class="acts"><button class="sec" title="Subir" onclick="move(this,-1)">↑</button><button class="sec" title="Bajar" onclick="move(this,1)">↓</button>
  <button class="sec" title="Quitar" onclick="const b=this.closest('.row').parentNode;this.closest('.row').remove();renum(b)">×</button></div></div>`;
}
function renum(box) {
  if (typeof box !== 'object') box = document.getElementById('steps-' + box);
  box.querySelectorAll('.row').forEach((r, i) => r.querySelector('.pos').textContent = i + 1);
  const m = document.getElementById('msg-' + box.id.split('-')[1]); if (m) m.textContent = '⚠️ Cambios sin guardar';
}
function move(btn, dir) {
  const row = btn.closest('.row'), box = row.parentNode;
  const other = dir < 0 ? row.previousElementSibling : row.nextElementSibling;
  if (!other) return;
  dir < 0 ? box.insertBefore(row, other) : box.insertBefore(other, row);
  renum(box); btn.focus();
}
// arrastrar y soltar (tomando del número de la izquierda)
let dragRow = null;
document.addEventListener('mousedown', (e) => { const h = e.target.closest('.pos'); if (h) h.parentNode.draggable = true; });
document.addEventListener('mouseup', () => document.querySelectorAll('.row[draggable]').forEach((r) => r.removeAttribute('draggable')));
document.addEventListener('dragstart', (e) => {
  dragRow = e.target.closest?.('.row'); if (!dragRow) return;
  dragRow.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', '');
});
document.addEventListener('dragover', (e) => {
  const over = e.target.closest?.('.row');
  if (!dragRow || !over || over === dragRow || over.parentNode !== dragRow.parentNode) return;
  e.preventDefault();
  const r = over.getBoundingClientRect();
  over.parentNode.insertBefore(dragRow, e.clientY < r.top + r.height / 2 ? over : over.nextSibling);
});
document.addEventListener('dragend', () => {
  if (!dragRow) return;
  dragRow.classList.remove('dragging'); dragRow.removeAttribute('draggable'); renum(dragRow.parentNode); dragRow = null;
});
function addStep(t) { const box = document.getElementById('steps-' + t); box.insertAdjacentHTML('beforeend', stepRow(t, {}, box.children.length)); }

function build() {
  root.innerHTML = `<header><h1>🗺️ Búsqueda del Tesoro – Admin</h1>
  <a class="btn" href="/admin/print" target="_blank">🖨️ Imprimir QRs</a>
  <button onclick="startAll()">▶️ Iniciar juego</button>
  <button class="danger" onclick="resetAll()">↺ Reiniciar</button></header>
  <main><div class="card"><h2>Progreso en vivo</h2><div id="progress"></div></div>
  <div class="grid">${data.teams.map((t) => `<div class="card">
    <h2 id="title-${t.id}">${esc(t.name)}</h2>
    <div class="f"><div><label class="muted">Nombre</label><input id="name-${t.id}" value="${esc(t.name)}" oninput="renameLabel(${t.id})"></div>
    <div><label class="muted">Código (lo ingresan los jugadores)</label><input id="code-${t.id}" value="${esc(t.code)}"></div></div>
    <label class="muted">Pistas en orden: cada pista dice dónde está su QR. Reordená con ↑ ↓ o arrastrando el número.</label>
    <div id="steps-${t.id}">${t.steps.map((s, i) => stepRow(t.id, s, i)).join('')}</div>
    <div class="f"><button class="sec" onclick="addStep(${t.id})">+ Agregar pista</button></div>
    <label class="muted">Mensaje final (al escanear el último QR)</label>
    <textarea id="final-${t.id}">${esc(t.final_message)}</textarea>
    <p><button id="save-${t.id}" onclick="saveTeam(${t.id})">💾 Guardar ${esc(t.name)}</button> <span id="msg-${t.id}" class="muted"></span></p>
  </div>`).join('')}</div></main>`;
  renderProgress();
}

function renderProgress() {
  const el = document.getElementById('progress'); if (!el) return;
  const fmt = (ms) => { const s = Math.round(ms / 1000); return `${Math.floor(s / 60)}m ${s % 60}s`; };
  el.innerHTML = '<div class="grid">' + data.teams.map((t) => {
    const done = t.steps.filter((s) => s.scanned_at).length;
    const state = !t.started_at ? 'sin iniciar' : t.finished_at ? `🏁 terminó en ${fmt(t.finished_at - t.started_at)}` : `en juego (${fmt(Date.now() - t.started_at)})`;
    return `<div><b>${esc(t.name)}</b> — ${done}/${t.steps.length} — ${state}` +
      t.steps.map((s) => `<div class="prog ${s.scanned_at ? 'done' : ''}">${s.scanned_at ? '✔' : '○'} Pista ${s.pos} → QR #${s.qr_id ?? '?'}${s.location ? ' 📍 ' + esc(s.location) : ''} ${s.scanned_at ? '(' + new Date(s.scanned_at).toLocaleTimeString() + ')' : ''}</div>`).join('') + '</div>';
  }).join('') + '</div>';
}

function renameLabel(id) {
  const n = document.getElementById('name-' + id).value.trim() || 'equipo';
  document.getElementById('title-' + id).textContent = n;
  document.getElementById('save-' + id).textContent = '💾 Guardar ' + n;
}
async function saveTeam(id) {
  const steps = [...document.querySelectorAll(`#steps-${id} .row`)].map((r) => ({ clue: r.querySelector('textarea').value, qr_id: r.querySelector('select').value, location: r.querySelector('.loc').value }));
  const missing = steps.findIndex((s) => !s.clue.trim() || !s.qr_id);
  const m = document.getElementById('msg-' + id);
  if (missing >= 0) { m.textContent = `⚠️ Falta completar la pista ${missing + 1}`; return; }
  const r = await api('/api/admin/teams/' + id, 'PUT', { name: document.getElementById('name-' + id).value, code: document.getElementById('code-' + id).value, final_message: document.getElementById('final-' + id).value, steps });
  m.textContent = r.status === 200 ? '✅ Guardado' : '❌ ' + (r.data.error || 'error');
  if (r.status === 200) refreshProgress();
}
async function refreshProgress() { const r = await api('/api/admin/data'); if (r.status === 200) { data = r.data; renderProgress(); } }
async function startAll() { if (confirm('¿Iniciar el juego para los dos equipos?')) { await api('/api/admin/start', 'POST'); refreshProgress(); } }
async function resetAll() { if (confirm('Esto borra todo el progreso y el cronómetro. ¿Seguro?')) { await api('/api/admin/reset', 'POST'); refreshProgress(); } }

setInterval(() => document.getElementById('progress') && refreshProgress(), 5000);
load();
</script></body></html>
